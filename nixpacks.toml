[phases.setup]
nixPkgs = ["python311", "nodejs_20", "nodePackages.npm", "nginx"]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "cd ui && npm ci --prefer-offline"
]

[phases.build]
cmds = [
  "cd ui && npm run build",
  "python -m alembic upgrade head || true"
]

[start]
cmd = "bash start-prod.sh"
